<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakon F-135</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: #ffffff;
      --surface2: #f9f6f0;
      --border: #1a1918;
      --text: #1a1918;
      --muted: #666;
      --accent: #ffb500;
      --accent-hover: #eab308;
      --green: #059669;
      --orange: #ea580c;
      --red: #e32636;
      --shadow: 4px 4px 0px 0px rgba(26, 25, 24, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px;
      position: relative;
    }
    
    /* Film Grain Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.4;
      pointer-events: none;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 10px;
      border-bottom: 4px solid var(--border);
    }
    header h1 { 
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem; 
      font-weight: 700; 
      text-transform: uppercase;
      letter-spacing: -0.02em; 
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 4px 10px;
      box-shadow: 2px 2px 0px 0px rgba(26,25,24,1);
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      border: 1px solid var(--border);
      transition: background 0.3s;
    }
    .dot.warm   { background: var(--green); }
    .dot.cold   { background: var(--orange); }
    .badge.warm { color: var(--text); }
    .badge.cold { color: var(--text); }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: var(--border);
    }
    .card h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      background: var(--accent);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 8px 16px;
      font-size: 0.88rem;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 2px 2px 0px 0px rgba(26,25,24,1);
      transition: all 0.15s;
    }
    button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(26,25,24,1); }
    button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0px 0px 0px 0px rgba(26,25,24,1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    
    button.ghost {
      background: var(--surface);
      color: var(--text);
    }
    button.ghost:hover:not(:disabled) { background: var(--bg); }

    label.field {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.85rem; color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
    }
    input[type="number"], input[type="text"], select {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.88rem;
      font-family: 'IBM Plex Mono', monospace;
    }
    input[type="number"] { width: 68px; }
    input[type="text"]   { width: 130px; }
    select               { padding-right: 6px; cursor: pointer; }
    input[type="file"]   { display: none; }
    .upload-label {
      background: var(--surface);
      border: 2px dashed var(--border);
      padding: 7px 13px;
      font-size: 0.88rem;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .upload-label:hover { background: var(--bg); border-style: solid; }

    .progress-wrap { margin-top: 16px; display: none; }
    .progress-wrap.show { display: block; }
    progress {
      display: block; width: 100%; height: 12px;
      border: 2px solid var(--border);
      background: var(--surface);
      appearance: none;
    }
    progress::-webkit-progress-bar   { background: var(--surface); }
    progress::-webkit-progress-value { background: var(--red); }
    progress::-moz-progress-bar      { background: var(--red); }
    .progress-label { font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 5px; }

    .msg { font-size: 0.83rem; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--muted); }
    .msg.ok  { color: var(--green); }
    .msg.err { color: var(--red); }
    .feed-prompt {
      margin-top: 14px; padding: 12px; display: none;
      border: 2px solid var(--green); color: var(--green);
      font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 1rem;
    }
    .feed-prompt.show { display: block; }

    .file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .file-name {
      font-size: 0.83rem; font-family: 'IBM Plex Mono', monospace;
      color: var(--muted); max-width: 280px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-name.set { color: var(--text); font-weight: 600; background: var(--accent); padding: 2px 6px; border: 1px solid var(--border); }

    .log-box {
      margin-top: 14px;
      background: var(--border);
      border: 2px solid var(--border);
      padding: 10px;
      font-size: 0.76rem; font-family: 'IBM Plex Mono', monospace;
      color: var(--green);
      max-height: 120px; overflow-y: auto;
      display: none;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
    }
    .log-box.show { display: block; }

    #frames-section { margin-top: 4px; }
    .frames-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }
    .frames-header h2 { margin-bottom: 0; }
    .frames-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }
    .frame-card {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px 0px rgba(26,25,24,1);
      overflow: hidden;
    }
    .frame-card img {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
      background: var(--border);
      border-bottom: 2px solid var(--border);
    }
    .frame-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg);
    }
    .frame-num { font-size: 0.75rem; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text); }
    .frame-footer a {
      font-size: 0.75rem; font-family: 'IBM Plex Mono', monospace; color: var(--red); text-decoration: none; font-weight: 600;
    }
    .frame-footer a:hover { text-decoration: underline; }

    .hidden { display: none !important; }

    /* ── Film strip / crop placement ── */
    .strip-wrap {
      overflow-x: auto; overflow-y: hidden;
      background: var(--border); border: 2px solid var(--border); 
      margin-top: 14px;
      padding: 10px 0;
      position: relative;
    }
    .strip-wrap::before, .strip-wrap::after {
      content: ""; position: absolute; left: 0; right: 0; height: 8px;
      background-image: radial-gradient(circle at 6px 4px, transparent 3px, #f4f1ea 3.5px);
      background-size: 12px 8px; background-repeat: repeat-x;
    }
    .strip-wrap::before { top: 2px; }
    .strip-wrap::after { bottom: 2px; }
    
    .strip-inner { position: relative; line-height: 0; margin: 8px 0; }
    #strip-img { display: block; height: auto; }
    .cropbox {
      position: absolute; top: 0; bottom: 0;
      border: 2px solid rgba(255,181,0,0.8);
      box-sizing: border-box; cursor: pointer;
    }
    .cropbox .lbl {
      position: absolute; top: 2px; left: 4px;
      font-size: 11px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; 
      color: #000; background: var(--accent);
      padding: 0 4px; border: 1px solid #000; line-height: 1.5;
    }
    .cropbox.active {
      border-color: var(--red);
      border-width: 3px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65);
    }
    .cropbox.active .lbl { background: var(--red); color: #fff; }

    /* ── Folder picker modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
    }
    .modal {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 8px 8px 0px 0px rgba(227, 38, 54, 1);
      width: min(560px, 92vw);
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 2px solid var(--border);
      background: var(--accent);
    }
    .modal-head h2 {
      font-size: 1rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      text-transform: uppercase; color: var(--text); margin: 0;
    }
    .browse-path {
      padding: 10px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem;
      color: var(--text); border-bottom: 2px solid var(--border);
      background: var(--surface2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      direction: rtl; text-align: left; font-weight: 600;
    }
    .browse-list { overflow-y: auto; flex: 1; min-height: 120px; background: var(--bg); }
    .browse-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 0.86rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .browse-item:hover { background: var(--surface); font-weight: 600; }
    .browse-item .ic { color: var(--red); flex-shrink: 0; font-weight: bold; }
    .browse-empty { padding: 16px 20px; color: var(--muted); font-size: 0.82rem; font-family: 'IBM Plex Mono', monospace; }
    .modal-foot {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border-top: 2px solid var(--border);
      background: var(--surface);
    }
    .modal-foot .spacer { flex: 1; }
    #browse-close {
      padding: 4px 10px; font-size: 1rem; line-height: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>Pakon F-135</h1>
  <div class="badge" id="badge">
    <div class="dot" id="dot"></div>
    <span id="badge-text">Checking…</span>
  </div>
</header>

<!-- Firmware (cold only) -->
<div class="card hidden" id="fw-card">
  <h2>Firmware</h2>
  <div class="row">
    <button id="fw-btn">Load firmware</button>
    <span class="msg" id="fw-msg"></span>
  </div>
  <div class="progress-wrap" id="fw-prog-wrap">
    <progress id="fw-prog"></progress>
    <div class="progress-label" id="fw-prog-label"></div>
  </div>
  <div class="log-box" id="fw-log"></div>
</div>

<!-- Scan (warm only) -->
<div class="card hidden" id="scan-card">
  <h2>Scan</h2>
  <div class="file-row" style="margin-bottom: 14px;">
    <span class="msg">Output folder:</span>
    <span class="file-name set" id="scan-out">…</span>
    <button class="ghost" id="scan-out-btn">Choose…</button>
  </div>
  <div class="row">
    <button id="scan-btn">Scan</button>
    <button class="ghost" id="eject-btn">Eject film</button>
    <span class="msg" id="scan-msg"></span>
  </div>
  <div class="msg" id="scan-mode" style="margin-top: 8px;"></div>
  <div class="feed-prompt" id="feed-prompt"></div>
  <div class="progress-wrap" id="scan-prog-wrap">
    <progress id="scan-prog" max="2200"></progress>
    <div class="progress-label" id="scan-prog-label"></div>
  </div>
  <div class="log-box" id="scan-log"></div>
</div>

<!-- Process (always) -->
<div class="card" id="proc-card">
  <h2>Process</h2>
  <div class="file-row">
    <span class="file-name" id="raw-name">No file — run a scan or upload a .raw file</span>
    <label class="upload-label">
      <input type="file" id="raw-upload" accept=".raw">
      Upload .raw…
    </label>
  </div>
  <div class="row" style="margin-top: 14px;">
    <label class="field">
      Rotate
      <select id="rotate">
        <option value="0">0°</option>
        <option value="90" selected>90°</option>
        <option value="180">180°</option>
        <option value="270">270°</option>
      </select>
    </label>
    <button id="proc-btn" disabled>Process</button>
  </div>
  <div class="progress-wrap" id="proc-prog-wrap">
    <progress id="proc-prog" value="0" max="1"></progress>
    <div class="progress-label" id="proc-prog-label"></div>
  </div>
  <div class="msg" id="proc-msg" style="margin-top: 8px;"></div>
</div>

<!-- Confirm frames (minilab-style crop placement) -->
<div class="card hidden" id="confirm-card">
  <div class="frames-header">
    <h2 id="confirm-title">Confirm frames</h2>
    <div class="row">
      <span class="msg" id="confirm-hint">← → nudge · ↑ ↓ prev/next · Enter add · Delete remove · click to place</span>
      <label class="field">
        Box
        <select id="box-size">
          <option value="full" selected>Full frame</option>
          <option value="half">Half frame</option>
        </select>
      </label>
      <button class="ghost" id="frame-add">+ Add</button>
      <button class="ghost" id="frame-del">− Remove</button>
      <button id="export-btn">Export <span id="export-count"></span> frames</button>
    </div>
  </div>
  <div class="strip-wrap" id="strip-wrap">
    <div class="strip-inner" id="strip-inner">
      <img id="strip-img" alt="film strip">
      <!-- crop boxes injected here -->
    </div>
  </div>
  <div class="progress-wrap" id="exp-prog-wrap">
    <progress id="exp-prog" value="0" max="1"></progress>
    <div class="progress-label" id="exp-prog-label"></div>
  </div>
</div>

<!-- Frames (after export) -->
<div class="card hidden" id="frames-section">
  <div class="frames-header">
    <h2 id="frames-title">Frames</h2>
    <div class="row">
      <span class="msg">Export:</span>
      <button class="ghost" id="export-jpeg">JPEGs</button>
      <button class="ghost" id="export-contact">Contact sheet</button>
      <button class="ghost" id="export-tiff">TIFFs</button>
      <button class="ghost" id="export-raw">Raw negatives</button>
      <button class="ghost" id="clear-btn" style="border-color: var(--red); color: var(--red);">Clear</button>
    </div>
  </div>
  <div class="frames-grid" id="frames-grid"></div>
</div>

<!-- Folder picker -->
<div class="modal-backdrop hidden" id="browse-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Choose output folder (on scanner host)</h2>
      <button class="ghost" id="browse-close">✕</button>
    </div>
    <div class="browse-path" id="browse-cur"></div>
    <div class="browse-list" id="browse-list"></div>
    <div class="modal-foot">
      <button class="ghost" id="browse-new">New folder…</button>
      <span class="spacer"></span>
      <span class="msg err" id="browse-msg"></span>
      <button id="browse-use">Use this folder</button>
    </div>
  </div>
</div>

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function setMsg(el, text, kind) {
    el.textContent = text;
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  // Consume a POST SSE stream.  bodyData may be FormData or a plain object.
  async function postSSE(url, bodyData, onEvent) {
    const isForm = bodyData instanceof FormData;
    const resp = await fetch(url, {
      method: 'POST',
      ...(isForm
        ? { body: bodyData }
        : { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData) }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (line.startsWith('data: ')) {
          try { onEvent(JSON.parse(line.slice(6))); } catch {}
        }
      }
    }
  }

  // ── Status polling ───────────────────────────────────────────────────────
  let hasScanFile = false;
  let uploadFile = null;
  let outDir = null;          // chosen scan output dir (on host)
  let outDirInit = false;     // seeded from server default yet?

  async function pollStatus() {
    try {
      const d = await fetch('/api/status').then(r => r.json());

      // Badge
      const labels = {
        warm: 'Scanner ready',
        cold: 'Scanner detected — needs firmware',
        disconnected: 'No scanner detected',
        unknown: 'Scanner status unknown',
      };
      $('badge').className = 'badge ' + d.state;
      $('dot').className   = 'dot '   + d.state;
      $('badge-text').textContent = d.state === 'unknown' && d.state_error
        ? `Status unknown — ${d.state_error}`
        : (labels[d.state] || d.state);

      $('fw-card').classList.toggle('hidden', d.state !== 'cold');
      $('scan-card').classList.toggle('hidden', d.state !== 'warm');

      $('scan-mode').textContent = d.eeprom
        ? `F-135: scan built in code (EEPROM ${d.eeprom}); F-135+: replayed script`
        : (d.eeprom_unit && d.eeprom_unit.error)
          ? `EEPROM: ${d.eeprom_unit.error} — scans are replayed`
          : 'No EEPROM archive yet — it is read when the scanner is warm; until then scans are replayed';

      // Seed the output folder from the server default once.
      if (!outDirInit && d.out_dir) {
        outDirInit = true;
        outDir = d.out_dir;
        $('scan-out').textContent = outDir;
      }

      // If a scan file exists server-side and we haven't surfaced it yet
      if (d.scan_file && !hasScanFile && !uploadFile) {
        hasScanFile = true;
        $('raw-name').textContent = d.scan_file;
        $('raw-name').classList.add('set');
        $('proc-btn').disabled = false;
      }
    } catch {}
  }

  setInterval(pollStatus, 2000);
  pollStatus();

  // ── Firmware load ────────────────────────────────────────────────────────
  $('fw-btn').addEventListener('click', async () => {
    const btn = $('fw-btn');
    btn.disabled = true;
    setMsg($('fw-msg'), '');
    $('fw-prog-wrap').classList.add('show');
    $('fw-prog').removeAttribute('value');   // indeterminate
    $('fw-log').textContent = '';
    $('fw-log').classList.add('show');

    const lines = [];
    await postSSE('/api/firmware', {}, ev => {
      if (ev.type === 'log') {
        lines.push(ev.message);
        const el = $('fw-log');
        el.textContent = lines.join('\n');
        el.scrollTop = el.scrollHeight;
      } else if (ev.type === 'done') {
        $('fw-prog').value = 1; $('fw-prog').max = 1;
        setMsg($('fw-msg'), 'Firmware loaded — scanner re-enumerating', 'ok');
      } else if (ev.type === 'error') {
        setMsg($('fw-msg'), ev.message, 'err');
      }
    });

    btn.disabled = false;
  });

  // ── Scan ─────────────────────────────────────────────────────────────────
  function logLine(id, text) {
    const el = $(id);
    el.classList.add('show');
    el.textContent += (el.textContent ? '\n' : '') + text;
    el.scrollTop = el.scrollHeight;
  }

  $('scan-btn').addEventListener('click', async () => {
    const btn = $('scan-btn');
    btn.disabled = true;
    $('eject-btn').disabled = true;
    setMsg($('scan-msg'), 'Starting…');
    $('scan-prog-wrap').classList.add('show');
    $('scan-prog').value = 0;
    $('scan-log').textContent = '';
    $('feed-prompt').classList.remove('show');
    hasScanFile = false;

    await postSSE('/api/scan', { out_dir: outDir }, ev => {
      if (ev.type === 'log') {
        logLine('scan-log', ev.message);
      } else if (ev.type === 'feed') {
        $('feed-prompt').textContent = ev.message;
        $('feed-prompt').classList.add('show');
        logLine('scan-log', ev.message);
      } else if (ev.type === 'progress') {
        $('scan-prog').value = ev.mb;
        $('scan-prog-label').textContent = `${ev.mb} MB received`;
        $('scan-msg').textContent = '';
      } else if (ev.type === 'done') {
        $('scan-prog').value = $('scan-prog').max;
        $('scan-prog-label').textContent = `Complete — ${ev.mb} MB`;
        setMsg($('scan-msg'), `Scan complete (${ev.mb} MB)`, 'ok');
        hasScanFile = true;
        $('raw-name').textContent = ev.path || 'scan.raw';
        $('raw-name').classList.add('set');
        $('proc-btn').disabled = false;
      } else if (ev.type === 'error') {
        setMsg($('scan-msg'), ev.message, 'err');
      }
    });

    $('feed-prompt').classList.remove('show');
    btn.disabled = false;
    $('eject-btn').disabled = false;
  });

  // ── Eject ────────────────────────────────────────────────────────────────
  $('eject-btn').addEventListener('click', async () => {
    const btn = $('eject-btn');
    btn.disabled = true;
    $('scan-btn').disabled = true;
    setMsg($('scan-msg'), 'Ejecting…');
    $('scan-log').textContent = '';
    await postSSE('/api/eject', {}, ev => {
      if (ev.type === 'log') {
        logLine('scan-log', ev.message);
        if (ev.message.startsWith('eject:'))
          setMsg($('scan-msg'), ev.message.slice(7), 'ok');
      } else if (ev.type === 'done') {
        if ($('scan-msg').textContent === 'Ejecting…')
          setMsg($('scan-msg'), 'Transport stopped', 'ok');
      } else if (ev.type === 'error') {
        setMsg($('scan-msg'), ev.message, 'err');
      }
    });
    btn.disabled = false;
    $('scan-btn').disabled = false;
  });

  // ── Output folder picker ───────────────────────────────────────────────────
  let browsePath = null;   // dir currently shown in the modal

  async function browseTo(path) {
    setMsg($('browse-msg'), '');
    const url = '/api/browse' + (path ? '?path=' + encodeURIComponent(path) : '');
    const d = await fetch(url).then(r => r.json());
    browsePath = d.path;
    $('browse-cur').textContent = d.path;

    const list = $('browse-list');
    list.innerHTML = '';

    if (d.parent) {
      const up = document.createElement('div');
      up.className = 'browse-item';
      up.innerHTML = '<span class="ic">↑</span><span>..</span>';
      up.onclick = () => browseTo(d.parent);
      list.appendChild(up);
    }
    for (const name of d.dirs) {
      const it = document.createElement('div');
      it.className = 'browse-item';
      it.innerHTML = '<span class="ic">▸</span><span></span>';
      it.querySelector('span:last-child').textContent = name;
      it.onclick = () => browseTo(d.path.replace(/\/$/, '') + '/' + name);
      list.appendChild(it);
    }
    if (!d.parent && !d.dirs.length) {
      const e = document.createElement('div');
      e.className = 'browse-empty';
      e.textContent = '(no subfolders)';
      list.appendChild(e);
    }
  }

  $('scan-out-btn').addEventListener('click', () => {
    $('browse-modal').classList.remove('hidden');
    browseTo(outDir);
  });
  $('browse-close').addEventListener('click', () => {
    $('browse-modal').classList.add('hidden');
  });
  $('browse-modal').addEventListener('click', e => {
    if (e.target === $('browse-modal')) $('browse-modal').classList.add('hidden');
  });

  $('browse-use').addEventListener('click', () => {
    if (!browsePath) return;
    outDir = browsePath;
    $('scan-out').textContent = outDir;
    $('browse-modal').classList.add('hidden');
  });

  $('browse-new').addEventListener('click', async () => {
    const name = prompt('New folder name:');
    if (!name) return;
    const resp = await fetch('/api/mkdir', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: browsePath, name }),
    });
    const d = await resp.json();
    if (!resp.ok) {
      setMsg($('browse-msg'), d.error || 'mkdir failed', 'err');
      return;
    }
    browseTo(d.path);   // descend into the freshly created folder
  });

  // ── File upload ──────────────────────────────────────────────────────────
  $('raw-upload').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    uploadFile = f;
    $('raw-name').textContent = f.name;
    $('raw-name').classList.add('set');
    $('proc-btn').disabled = false;
  });

  // ── Process = prescan (long preview + detected frame centres) ──────────────
  let meta = null;      // prescan metadata
  let crops = [];       // confirmed crops: {c: centre row, w: width} in full res
  let cur = 0;          // current frame index

  $('proc-btn').addEventListener('click', async () => {
    const btn = $('proc-btn');
    btn.disabled = true;
    setMsg($('proc-msg'), '');
    $('proc-prog-wrap').classList.add('show');
    $('proc-prog').value = 0;
    $('confirm-card').classList.add('hidden');
    $('frames-section').classList.add('hidden');
    $('frames-grid').innerHTML = '';

    const fd = new FormData();
    if (uploadFile) fd.append('file', uploadFile);

    await postSSE('/api/process', fd, ev => {
      if (ev.type === 'progress') {
        $('proc-prog').value = ev.pct;
        $('proc-prog-label').textContent = ev.step;
      } else if (ev.type === 'done') {
        $('proc-prog').value = 1;
        $('proc-prog-label').textContent = 'Done';
        meta = ev;
        startConfirm();
        setMsg($('proc-msg'),
               'Place frames — Enter adds the next box, Delete removes one', 'ok');
      } else if (ev.type === 'error') {
        setMsg($('proc-msg'), ev.message, 'err');
      }
    });
    btn.disabled = false;
  });

  // ── Confirm frames (interactive crop placement) ────────────────────────────
  function startConfirm() {
    // Start with a single box near the first detected frame; the operator adds
    // the rest with Enter (and removes with Delete). The full ribbon is shown.
    const first = (meta.centres && meta.centres.length)
      ? meta.centres[0] : Math.round(meta.frame_w / 2);
    crops = [{ c: first, w: boxSize() }];
    cur = 0;
    $('strip-img').src = '/api/preview?t=' + Date.now();
    $('strip-inner').style.width = meta.preview_w + 'px';
    $('confirm-card').classList.remove('hidden');
    renderStrip();
    $('strip-wrap').focus();
  }

  const fullToPx = c => c * meta.scale;                 // full row -> preview x
  // Box width (full-res rows) for the size selected in the dropdown.
  const boxSize = () => $('box-size').value === 'half'
    ? Math.round(meta.frame_w / 2) : meta.frame_w;

  function renderStrip() {
    const inner = $('strip-inner');
    inner.querySelectorAll('.cropbox').forEach(e => e.remove());
    crops.forEach((cp, i) => {
      const w = cp.w * meta.scale;
      const box = document.createElement('div');
      box.className = 'cropbox' + (i === cur ? ' active' : '');
      box.style.left = (fullToPx(cp.c) - w / 2) + 'px';
      box.style.width = w + 'px';
      box.innerHTML = `<span class="lbl">${i + 1}</span>`;
      box.onclick = () => { cur = i; renderStrip(); };
      inner.appendChild(box);
    });
    $('confirm-title').textContent =
      `Confirm frames — ${cur + 1} / ${crops.length}`;
    $('export-count').textContent = crops.length;
    // keep the active box in view
    const wrap = $('strip-wrap'), x = fullToPx(crops[cur].c);
    if (x < wrap.scrollLeft + 80 || x > wrap.scrollLeft + wrap.clientWidth - 80)
      wrap.scrollLeft = x - wrap.clientWidth / 2;
  }

  function nudge(dpx) {                  // dpx in preview pixels -> full rows
    crops[cur].c = Math.max(0, Math.min(meta.rows,
      crops[cur].c + Math.round(dpx / meta.scale)));
    renderStrip();
  }
  const step = () => Math.max(4, Math.round(meta.pitch * 0.004));  // micro (full rows)
  function go(d) { cur = Math.max(0, Math.min(crops.length - 1, cur + d)); renderStrip(); }
  function addFrame() {
    // Place the new box of the selected size immediately after the last one
    // (edge to edge), so full and half frames tile correctly when added in a run.
    const w = boxSize();
    const last = crops[crops.length - 1];
    const c = Math.min(meta.rows, last.c + Math.round((last.w + w) / 2));
    crops.push({ c, w }); cur = crops.length - 1; renderStrip();
  }
  function delFrame() {
    if (crops.length <= 1) return;
    crops.splice(cur, 1); cur = Math.min(cur, crops.length - 1); renderStrip();
  }

  $('frame-add').addEventListener('click', addFrame);
  $('frame-del').addEventListener('click', delFrame);
  // Changing the dropdown resizes the currently selected box.
  $('box-size').addEventListener('change', () => {
    if (crops.length) { crops[cur].w = boxSize(); renderStrip(); }
    $('strip-wrap').focus();
  });

  // click on the strip background to place the current crop there
  $('strip-inner').addEventListener('click', e => {
    if (e.target.closest('.cropbox')) return;
    const rect = $('strip-inner').getBoundingClientRect();
    crops[cur].c = Math.round((e.clientX - rect.left) / meta.scale);
    renderStrip();
  });

  // keyboard: ←/→ nudge (Shift = coarse), ↑/↓ prev/next,
  // Enter adds a box, Delete/Backspace removes the current one
  window.addEventListener('keydown', e => {
    if ($('confirm-card').classList.contains('hidden')) return;
    const k = e.key, big = e.shiftKey ? 6 : 1;
    if (k === 'ArrowLeft')       { nudge(-step() * big * meta.scale); }
    else if (k === 'ArrowRight') { nudge(step() * big * meta.scale); }
    else if (k === 'ArrowUp')    { go(-1); }
    else if (k === 'ArrowDown')  { go(1); }
    else if (k === 'Enter')      { addFrame(); }
    else if (k === 'Delete' || k === 'Backspace') { delFrame(); }
    else return;
    e.preventDefault();
  });

  // ── Export the confirmed crops at full resolution ──────────────────────────
  $('export-btn').addEventListener('click', async () => {
    const btn = $('export-btn');
    btn.disabled = true;
    $('exp-prog-wrap').classList.add('show');
    $('exp-prog').value = 0;
    $('frames-section').classList.add('hidden');
    $('frames-grid').innerHTML = '';

    await postSSE('/api/export_frames',
      { centres: crops.map(c => Math.round(c.c)),
        widths: crops.map(c => Math.round(c.w)),
        rotate: parseInt($('rotate').value) },
      ev => {
        if (ev.type === 'progress') {
          $('exp-prog').value = ev.pct;
          $('exp-prog-label').textContent = ev.step;
        } else if (ev.type === 'done') {
          $('exp-prog').value = 1;
          $('exp-prog-label').textContent = 'Done';
          loadFrames();
        } else if (ev.type === 'error') {
          $('exp-prog-label').textContent = ev.message;
        }
      });
    btn.disabled = false;
  });

  // ── Frames grid (after export) ─────────────────────────────────────────────
  async function loadFrames() {
    const frames = await fetch('/api/frames').then(r => r.json());
    if (!frames.length) return;
    $('frames-section').classList.remove('hidden');
    $('frames-title').textContent = `Frames (${frames.length})`;
    const grid = $('frames-grid');
    grid.innerHTML = '';
    for (const { index } of frames) {
      const n2 = String(index).padStart(2, '0');
      const card = document.createElement('div');
      card.className = 'frame-card';
      card.innerHTML = `
        <img src="/api/frames/${index}/thumb?t=${Date.now()}"
             alt="Frame ${index}" loading="lazy">
        <div class="frame-footer">
          <span class="frame-num">Frame ${index}</span>
          <span>
            <a href="/api/frames/${index}/raw"  download="frame_${n2}_raw.tif">raw</a>
            &nbsp;·&nbsp;
            <a href="/api/frames/${index}/tiff" download="frame_${n2}.tif">TIFF</a>
            &nbsp;·&nbsp;
            <a href="/api/frames/${index}/jpeg" download="frame_${n2}.jpg">JPG</a>
          </span>
        </div>`;
      grid.appendChild(card);
    }
  }

  // ── Export zip / contact sheet ─────────────────────────────────────────────
  $('export-raw').addEventListener('click',     () => window.location = '/api/export?fmt=raw');
  $('export-tiff').addEventListener('click',    () => window.location = '/api/export?fmt=tiff');
  $('export-jpeg').addEventListener('click',    () => window.location = '/api/export?fmt=jpeg');
  $('export-contact').addEventListener('click', () => window.location = '/api/contact');

  // ── Clear current scan + temp files ────────────────────────────────────────
  $('clear-btn').addEventListener('click', async () => {
    if (!confirm('Clear the current scan and delete decoded temp files?\n'
                 + '(A scan.raw saved to your output folder is kept.)')) return;
    await fetch('/api/clear', { method: 'POST' });
    meta = null; crops = []; cur = 0;
    $('confirm-card').classList.add('hidden');
    $('frames-section').classList.add('hidden');
    $('frames-grid').innerHTML = '';
    $('frames-title').textContent = 'Frames';
    $('raw-name').textContent = 'No file — run a scan or upload a .raw file';
    $('raw-name').classList.remove('set');
    $('proc-btn').disabled = true;
    hasScanFile = false;
    uploadFile = null;
    $('raw-upload').value = '';
    setMsg($('proc-msg'), '');
    setMsg($('scan-msg'), '');
    $('proc-prog-wrap').classList.remove('show');
    $('scan-prog-wrap').classList.remove('show');
  });
</script>
</body>
</html>
